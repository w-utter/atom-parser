[package]
name = "atom-parser"
version = "0.1.0"
edition = "2024"

[features]
extended_sized_atoms = []
store_unknown_fields = []

[dependencies]
thiserror = "2.0"
futures-core = "0.3"
pin-project = "1.1"
atom-parser-derive = {path = "../atom-parser-derive"}

# only for async runtime and for `StreamExt`
tokio = {version = "1.53", features = ["rt", "macros"]}
tokio-stream = "0.1"
