[package]
name = "pcap"
version = "0.1.0"
edition = "2024"

[features]
store_unknown_fields = []
std = ["atom-parser/std"]

[dev-dependencies]
tokio-stream = "0.1"

[dependencies]
atom-parser = { path = "../atom-parser", features = ["provided_readers", "alloc"] }

# only for async runtime and for `StreamExt`
tokio = {version = "1.53", features = ["rt", "macros"]}
